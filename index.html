<!DOCTYPE html>
<html lang="sr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Интерактивни приказ метеоролошких ризика</title>

    <link
        rel="stylesheet"
        href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
    />

    <link rel="stylesheet" href="css/app.css">
</head>

<body>

<div class="header">

    <div class="language-switch">

        <button
            class="lang-button active"
            data-lang="sr">
            SR
        </button>

        <button
            class="lang-button"
            data-lang="en">
            EN
        </button>

    </div>

    <h1 id="main-title"></h1>

    <div
        class="subtitle"
        id="subtitle">
    </div>

    <div
        class="update-info"
        id="update-info">
    </div>

</div>


<div class="toolbar">

    <div class="search-wrapper">

        <input
            type="text"
            id="municipality-search"
            autocomplete="off"
        >

        <button
            id="search-button"
            type="button">
            🔎
        </button>

        <div
            id="search-results"
            class="search-results">
        </div>

    </div>

    <button
        class="action-button"
        id="location-button"
        type="button">
    </button>

    <button
        class="action-button"
        id="pdf-button"
        type="button">
    </button>

    <button
        class="action-button"
        id="share-button"
        type="button">
    </button>

</div>


<div class="controls">

    <div class="hazard-group-tabs">
        <button
            class="hazard-group-button"
            id="storm-group-button"
            type="button">
            <span id="storm-group-label">⛈ ОЛУЈА</span>
            <span class="arrow">▼</span>
        </button>

        <button
            class="hazard-group-button"
            id="wind-group-button"
            type="button">
            <span id="wind-group-label">💨 ВЕТАР</span>
            <span class="arrow">▼</span>
        </button>

        <button
            class="hazard-group-button"
            id="temperature-group-button"
            type="button">
            <span id="temperature-group-label">🌡 ТЕМПЕРАТУРА</span>
            <span class="arrow">▼</span>
        </button>
    </div>

    <div class="hazard-subcontrols" id="storm-subcontrols">

        <button
            class="layer-button"
            data-layer="thunder"
            id="btn-thunder">
        </button>

        <button
            class="layer-button"
            data-layer="hail"
            id="btn-hail">
        </button>

        <button
            class="layer-button"
            data-layer="large_hail"
            id="btn-large-hail">
        </button>

        <button
            class="layer-button"
            data-layer="very_large_hail"
            id="btn-very-large-hail">
        </button>

    </div>

    <div class="hazard-subcontrols" id="wind-subcontrols">
        <button class="layer-button" data-layer="wind_risk_level" id="btn-wind-risk"></button>
        <button class="layer-button" data-layer="wind_10" id="btn-wind-10"></button>
        <button class="layer-button" data-layer="wind_17" id="btn-wind-17"></button>
        <button class="layer-button" data-layer="wind_24" id="btn-wind-24"></button>
        <button class="layer-button" data-layer="wind_28" id="btn-wind-28"></button>
    </div>

    <div class="hazard-subcontrols" id="temperature-subcontrols">
        <button
            class="layer-button"
            data-layer="max_temperature"
            id="btn-max-temperature">
        </button>
    </div>

</div>


<div class="timeline-panel">

    <div class="timeline-main">

        <button
            id="previous-time"
            class="time-button"
            type="button">
            ◀
        </button>

        <button
            id="play-time"
            class="time-button"
            type="button">
            ▶
        </button>

        <div class="time-slider-wrapper">

            <input
                type="range"
                id="time-slider"
                min="0"
                max="39"
                step="1"
                value="0"
            >

            <div class="time-info">

                <span id="valid-time-label">
                    —
                </span>

                <span id="lead-time-label">
                    —
                </span>

            </div>

        </div>

        <button
            id="next-time"
            class="time-button"
            type="button">
            ▶
        </button>

    </div>

</div>


<div id="map"></div>


<div
    id="disclaimer"
    class="disclaimer">
</div>


<div
    id="status-message"
    class="status-message">
</div>


<div
    id="share-panel"
    class="share-panel">

    <button type="button" id="share-native">
        📱 Share
    </button>

    <button type="button" id="share-whatsapp">
        WhatsApp
    </button>

    <button type="button" id="share-viber">
        Viber
    </button>

    <button type="button" id="share-telegram">
        Telegram
    </button>

    <button type="button" id="share-email">
        Email
    </button>

</div>


<div id="mobile-detail-panel" class="mobile-detail-panel" aria-hidden="true">
    <div class="mobile-detail-header">
        <h2 id="mobile-detail-heading" class="mobile-detail-heading"></h2>
        <button id="mobile-detail-close" class="mobile-detail-close" type="button" aria-label="Close">×</button>
    </div>
    <div id="mobile-detail-body" class="mobile-detail-body"></div>
</div>

<div id="overview-panel" class="overview-panel" aria-hidden="true">
    <div class="overview-header">
        <div>
            <h2 id="overview-title" class="overview-title"></h2>
            <div id="overview-subtitle" class="overview-subtitle"></div>
        </div>
        <button id="overview-close" class="overview-close" type="button" aria-label="Close">×</button>
    </div>
    <div id="overview-body" class="overview-body"></div>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@turf/turf@7/turf.min.js"></script>


<script src="js/hazards/temperature.js"></script>
<script src="js/app.js"></script>
</body>
</html>
