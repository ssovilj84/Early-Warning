<!DOCTYPE html>
<html lang="sr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Интерактивни приказ метеоролошких ризика</title>

    <link
        rel="stylesheet"
        href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
        crossorigin=""
    />

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, Helvetica, sans-serif;
            background: #f4f6f8;
            color: #222;
        }

        .header {
            position: relative;
            padding: 14px 130px 14px 18px;
            background: white;
            border-bottom: 1px solid #d9dde2;
        }

        .header h1 {
            margin: 0 0 6px 0;
            font-size: 21px;
            line-height: 1.25;
        }

        .subtitle {
            color: #666;
            font-size: 14px;
        }

        .language-switch {
            position: absolute;
            right: 18px;
            top: 17px;
            display: flex;
            gap: 5px;
        }

        .lang-button {
            border: 1px solid #aaa;
            background: white;
            border-radius: 5px;
            padding: 6px 10px;
            cursor: pointer;
            font-weight: bold;
        }

        .lang-button.active {
            background: #222;
            color: white;
            border-color: #222;
        }

        .controls {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            padding: 12px 18px;
            background: white;
            border-bottom: 1px solid #d9dde2;
        }

        .layer-button {
            border: 1px solid #bbb;
            background: #fff;
            border-radius: 7px;
            padding: 9px 13px;
            cursor: pointer;
            font-size: 14px;
        }

        .layer-button:hover {
            background: #f0f0f0;
        }

        .layer-button.active {
            background: #222;
            color: white;
            border-color: #222;
        }

        #map {
            height: calc(100vh - 188px);
            min-height: 520px;
            width: 100%;
        }

        .legend {
            background: white;
            padding: 10px 12px;
            border-radius: 6px;
            line-height: 20px;
            box-shadow: 0 1px 5px rgba(0,0,0,0.25);
            font-size: 13px;
        }

        .legend-title {
            font-weight: bold;
            margin-bottom: 5px;
        }

        .legend-row {
            display: flex;
            align-items: center;
            gap: 7px;
        }

        .legend-box {
            width: 18px;
            height: 14px;
            border: 1px solid #777;
        }

        .popup-title {
            font-size: 17px;
            font-weight: bold;
            margin-bottom: 5px;
        }

        .popup-valid {
            color: #666;
            font-size: 12px;
            margin-bottom: 9px;
        }

        .popup-section {
            font-weight: bold;
            margin-top: 9px;
            margin-bottom: 5px;
        }

        .popup-row {
            margin: 4px 0;
        }

        .disclaimer {
            position: absolute;
            z-index: 900;
            left: 50%;
            bottom: 10px;
            transform: translateX(-50%);
            background: rgba(255,255,255,0.92);
            padding: 5px 10px;
            border-radius: 5px;
            font-size: 11px;
            color: #555;
            box-shadow: 0 1px 4px rgba(0,0,0,0.15);
            max-width: 80%;
            text-align: center;
            pointer-events: none;
        }

        @media (max-width: 800px) {

            .header {
                padding: 14px 18px 12px 18px;
            }

            .header h1 {
                font-size: 17px;
                padding-right: 0;
                margin-top: 40px;
            }

            .language-switch {
                left: 18px;
                right: auto;
                top: 10px;
            }

            .layer-button {
                flex: 1 1 45%;
                font-size: 12px;
            }

            #map {
                height: 70vh;
                min-height: 480px;
            }

            .disclaimer {
                max-width: 90%;
                width: 90%;
            }
        }
    </style>
</head>

<body>

<div class="header">

    <div class="language-switch">
        <button class="lang-button active" data-lang="sr">SR</button>
        <button class="lang-button" data-lang="en">EN</button>
    </div>

    <h1 id="main-title"></h1>

    <div
        class="subtitle"
        id="subtitle">
    </div>

</div>


<div class="controls">

    <button
        class="layer-button active"
        data-layer="p_thunder"
        id="btn-thunder">
    </button>

    <button
        class="layer-button"
        data-layer="p_hail_env"
        id="btn-hail">
    </button>

    <button
        class="layer-button"
        data-layer="p_large_hail"
        id="btn-large-hail">
    </button>

    <button
        class="layer-button"
        data-layer="p_severe_hail"
        id="btn-very-large-hail">
    </button>

</div>


<div id="map"></div>

<div
    class="disclaimer"
    id="disclaimer">
</div>


<script
    src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
    crossorigin="">
</script>


<script>

/* ============================================================
   JEZIK
   ============================================================ */

let currentLanguage = "sr";
let currentLayer = "p_thunder";
let geojsonLayer = null;


/* ============================================================
   PREVODI
   ============================================================ */

const translations = {

    sr: {

        title:
            "Интерактивни приказ метеоролошких ризика по јединицама локалне самоуправе у Републици Србији",

        subtitle:
            "Модел: GEFS ансамбл · Важи за: 25.08.2026. 12 UTC · Прогностички рок: +156 h",

        thunder:
            "⚡ Грмљавина",

        hail:
            "🧊 Ризик од града",

        largeHail:
            "🧊 Ризик од крупног града (≥ 2 cm)",

        veryLargeHail:
            "🧊 Ризик од веома крупног града (≥ 5 cm)",

        legend:
            "Ансамбл сигнал",

        valid:
            "Важи за",

        modelParameters:
            "Параметри модела",

        instability:
            "Нестабилност (CAPE)",

        shear:
            "Смицање ветра (850–500 hPa)",

        humidity:
            "Релативна влажност (700 hPa)",

        gridPoints:
            "Број GEFS grid тачака",

        buffer:
            "Просторни buffer",

        disclaimer:
            "Експериментални развојни производ — није званично метеоролошко упозорење."

    },


    en: {

        title:
            "Interactive Weather Risk Map by Local Government Units in the Republic of Serbia",

        subtitle:
            "Model: GEFS ensemble · Valid: 25 Aug 2026 12 UTC · Lead time: +156 h",

        thunder:
            "⚡ Thunderstorm",

        hail:
            "🧊 Hail risk",

        largeHail:
            "🧊 Large hail risk (≥ 2 cm)",

        veryLargeHail:
            "🧊 Very large hail risk (≥ 5 cm)",

        legend:
            "Ensemble signal",

        valid:
            "Valid",

        modelParameters:
            "Model parameters",

        instability:
            "Instability (CAPE)",

        shear:
            "Wind shear (850–500 hPa)",

        humidity:
            "Relative humidity (700 hPa)",

        gridPoints:
            "Number of GEFS grid points",

        buffer:
            "Spatial buffer",

        disclaimer:
            "Experimental development product — not an official meteorological warning."
    }
};


/* ============================================================
   MAPA
   ============================================================ */

const map = L.map(
    "map",
    {
        zoomControl: true
    }
).setView(
    [44.0, 20.8],
    7
);


L.tileLayer(
    "https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",
    {
        maxZoom: 19,
        attribution:
            '&copy; OpenStreetMap contributors'
    }
).addTo(map);


/* ============================================================
   BOJE
   ============================================================ */

function getProbabilityColor(value) {

    if (
        value === null ||
        value === undefined ||
        isNaN(value)
    ) {
        return "#cccccc";
    }

    if (value >= 50) {
        return "#7b3294";
    }

    if (value >= 30) {
        return "#d7191c";
    }

    if (value >= 20) {
        return "#fdae61";
    }

    if (value >= 10) {
        return "#ffffbf";
    }

    return "#a6d96a";
}


/* ============================================================
   STIL POLIGONA
   ============================================================ */

function styleFeature(feature) {

    const value = Number(
        feature.properties[currentLayer] ?? 0
    );

    return {
        fillColor:
            getProbabilityColor(value),

        weight: 1,

        opacity: 1,

        color: "#555",

        fillOpacity: 0.72
    };
}


/* ============================================================
   FORMATIRANJE
   ============================================================ */

function formatProbability(value) {

    const number = Number(value);

    if (!Number.isFinite(number)) {
        return "–";
    }

    return number.toFixed(1) + "%";
}


function formatNumber(value, decimals) {

    const number = Number(value);

    if (!Number.isFinite(number)) {
        return "–";
    }

    return number.toFixed(decimals);
}


/* ============================================================
   NAZIV OPŠTINE
   ============================================================ */

function municipalityName(properties) {

    if (currentLanguage === "sr") {

        return (
            properties.Value_sc ||
            properties.Value_sl ||
            properties.Value_e ||
            "–"
        );
    }

    return (
        properties.Value_e ||
        properties.Value_sl ||
        properties.Value_sc ||
        "–"
    );
}


/* ============================================================
   POPUP
   ============================================================ */

function popupContent(properties) {

    const t =
        translations[currentLanguage];

    const municipality =
        municipalityName(properties);

    return `

        <div class="popup-title">
            ${municipality}
        </div>

        <div class="popup-valid">
            ${t.valid}: 25.08.2026. 12 UTC
        </div>


        <div class="popup-row">
            ⚡ ${currentLanguage === "sr"
                ? "Грмљавина"
                : "Thunderstorm"}:
            <b>${formatProbability(
                properties.p_thunder
            )}</b>
        </div>


        <div class="popup-row">
            🧊 ${currentLanguage === "sr"
                ? "Ризик од града"
                : "Hail risk"}:
            <b>${formatProbability(
                properties.p_hail_env
            )}</b>
        </div>


        <div class="popup-row">
            🧊 ${currentLanguage === "sr"
                ? "Крупан град (≥ 2 cm)"
                : "Large hail (≥ 2 cm)"}:
            <b>${formatProbability(
                properties.p_large_hail
            )}</b>
        </div>


        <div class="popup-row">
            🧊 ${currentLanguage === "sr"
                ? "Веома крупан град (≥ 5 cm)"
                : "Very large hail (≥ 5 cm)"}:
            <b>${formatProbability(
                properties.p_severe_hail
            )}</b>
        </div>


        <div class="popup-section">
            ${t.modelParameters}
        </div>


        <div class="popup-row">
            ${t.instability}:
            <b>${formatNumber(
                properties.cape_med_max,
                0
            )} J/kg</b>
        </div>


        <div class="popup-row">
            ${t.shear}:
            <b>${formatNumber(
                properties.shear_med_max,
                1
            )} m/s</b>
        </div>


        <div class="popup-row">
            ${t.humidity}:
            <b>${formatNumber(
                properties.rh700_med_max,
                0
            )}%</b>
        </div>


        <div class="popup-row">
            ${t.gridPoints}:
            <b>${properties.grid_points ?? "–"}</b>
        </div>


        <div class="popup-row">
            ${t.buffer}:
            <b>${properties.buffer_km ?? 25} km</b>
        </div>

    `;
}


/* ============================================================
   HOVER
   ============================================================ */

function highlightFeature(event) {

    const layer =
        event.target;

    layer.setStyle({
        weight: 3,
        color: "#222",
        fillOpacity: 0.85
    });

    layer.bringToFront();
}


function resetHighlight(event) {

    if (geojsonLayer) {

        geojsonLayer.resetStyle(
            event.target
        );
    }
}


/* ============================================================
   FEATURE
   ============================================================ */

function onEachFeature(feature, layer) {

    layer.bindPopup(
        popupContent(
            feature.properties
        ),
        {
            maxWidth: 360
        }
    );

    layer.on({

        mouseover:
            highlightFeature,

        mouseout:
            resetHighlight,

        click:
            function() {

                this.setPopupContent(
                    popupContent(
                        feature.properties
                    )
                );
            }
    });
}


/* ============================================================
   GEOJSON
   ============================================================ */

fetch(
    "data/municipalities_f156_convective.geojson"
)

.then(response => {

    if (!response.ok) {

        throw new Error(
            "GeoJSON nije pronađen."
        );
    }

    return response.json();
})

.then(data => {

    geojsonLayer =
        L.geoJSON(
            data,
            {
                style:
                    styleFeature,

                onEachFeature:
                    onEachFeature
            }
        ).addTo(map);


    map.fitBounds(
        geojsonLayer.getBounds(),
        {
            padding: [15, 15]
        }
    );
})

.catch(error => {

    console.error(error);

    alert(
        "Greška pri učitavanju GeoJSON fajla."
    );
});


/* ============================================================
   PROMENA HAZARDA
   ============================================================ */

document
.querySelectorAll(
    ".layer-button"
)
.forEach(button => {

    button.addEventListener(
        "click",
        function() {

            currentLayer =
                this.dataset.layer;

            document
            .querySelectorAll(
                ".layer-button"
            )
            .forEach(btn =>

                btn.classList.remove(
                    "active"
                )
            );

            this.classList.add(
                "active"
            );


            if (geojsonLayer) {

                geojsonLayer.setStyle(
                    styleFeature
                );
            }
        }
    );
});


/* ============================================================
   LEGENDA
   ============================================================ */

const legend =
    L.control({
        position: "bottomright"
    });


legend.onAdd =
function() {

    const div =
        L.DomUtil.create(
            "div",
            "legend"
        );

    div.id =
        "map-legend";

    updateLegend(div);

    return div;
};


function updateLegend(div = null) {

    const element =
        div ||
        document.getElementById(
            "map-legend"
        );

    if (!element) {
        return;
    }

    const t =
        translations[currentLanguage];

    element.innerHTML = `

        <div class="legend-title">
            ${t.legend}
        </div>

        <div class="legend-row">
            <span
                class="legend-box"
                style="background:#a6d96a">
            </span>
            &lt; 10%
        </div>

        <div class="legend-row">
            <span
                class="legend-box"
                style="background:#ffffbf">
            </span>
            10–20%
        </div>

        <div class="legend-row">
            <span
                class="legend-box"
                style="background:#fdae61">
            </span>
            20–30%
        </div>

        <div class="legend-row">
            <span
                class="legend-box"
                style="background:#d7191c">
            </span>
            30–50%
        </div>

        <div class="legend-row">
            <span
                class="legend-box"
                style="background:#7b3294">
            </span>
            ≥ 50%
        </div>
    `;
}


legend.addTo(map);


/* ============================================================
   PROMENA JEZIKA
   ============================================================ */

function updateLanguage() {

    const t =
        translations[currentLanguage];


    document.documentElement.lang =
        currentLanguage;


    document.getElementById(
        "main-title"
    ).textContent =
        t.title;


    document.getElementById(
        "subtitle"
    ).textContent =
        t.subtitle;


    document.getElementById(
        "btn-thunder"
    ).textContent =
        t.thunder;


    document.getElementById(
        "btn-hail"
    ).textContent =
        t.hail;


    document.getElementById(
        "btn-large-hail"
    ).textContent =
        t.largeHail;


    document.getElementById(
        "btn-very-large-hail"
    ).textContent =
        t.veryLargeHail;


    document.getElementById(
        "disclaimer"
    ).textContent =
        t.disclaimer;


    document.title =
        t.title;


    updateLegend();


    /*
       Osvežavanje popup sadržaja
       nakon promene jezika
    */

    if (geojsonLayer) {

        geojsonLayer.eachLayer(
            function(layer) {

                if (
                    layer.feature &&
                    layer.feature.properties
                ) {

                    layer.setPopupContent(
                        popupContent(
                            layer.feature.properties
                        )
                    );
                }
            }
        );
    }
}


/* ============================================================
   SR / EN DUGMAD
   ============================================================ */

document
.querySelectorAll(
    ".lang-button"
)
.forEach(button => {

    button.addEventListener(
        "click",
        function() {

            currentLanguage =
                this.dataset.lang;


            document
            .querySelectorAll(
                ".lang-button"
            )
            .forEach(btn =>

                btn.classList.remove(
                    "active"
                )
            );


            this.classList.add(
                "active"
            );


            updateLanguage();
        }
    );
});


/* ============================================================
   POČETNI JEZIK
   ============================================================ */

updateLanguage();

</script>

</body>
</html>
